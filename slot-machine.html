<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>柏青哥點餐機 🎰</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon-cyan: #00ffff;
      --neon-magenta: #ff00ff;
      --neon-yellow: #ffff00;
      --neon-green: #39ff14;
      --neon-orange: #ff6600;
      --neon-red: #ff073a;
      --dark-bg: #0a0a0f;
      --panel-bg: #11111a;
      --reel-bg: #0d0d14;
      --text-main: #f0f0f5;
      --text-dim: #666677;
    }
    * { box-sizing: border-box; }
    body { font-family: 'Noto Sans TC', sans-serif; background: var(--dark-bg); color: var(--text-main); min-height: 100vh; margin: 0; overflow-x: hidden; }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    .bg-grid { background-image: linear-gradient(rgba(0,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,255,255,0.03) 1px, transparent 1px); background-size: 40px 40px; }
    .neon-text-cyan { text-shadow: 0 0 5px var(--neon-cyan), 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan), 0 0 40px var(--neon-cyan); }
    .neon-text-magenta { text-shadow: 0 0 5px var(--neon-magenta), 0 0 10px var(--neon-magenta), 0 0 20px var(--neon-magenta), 0 0 40px var(--neon-magenta); }
    .neon-text-yellow { text-shadow: 0 0 5px var(--neon-yellow), 0 0 10px var(--neon-yellow), 0 0 20px var(--neon-yellow), 0 0 40px var(--neon-yellow); }
    .neon-border-cyan { box-shadow: inset 0 0 10px rgba(0,255,255,0.3), 0 0 20px rgba(0,255,255,0.4), 0 0 40px rgba(0,255,255,0.2); border: 2px solid var(--neon-cyan); }
    .neon-border-magenta { box-shadow: inset 0 0 10px rgba(255,0,255,0.3), 0 0 20px rgba(255,0,255,0.4), 0 0 40px rgba(255,0,255,0.2); border: 2px solid var(--neon-magenta); }
    .neon-border-yellow { box-shadow: inset 0 0 10px rgba(255,255,0,0.3), 0 0 20px rgba(255,255,0,0.4), 0 0 40px rgba(255,255,0,0.2); border: 2px solid var(--neon-yellow); }
    .btn-neon { position: relative; border: none; cursor: pointer; font-family: 'Orbitron', sans-serif; font-weight: 700; transition: all 0.15s ease; }
    .btn-neon:active { transform: scale(0.96); }
    .btn-neon-red { background: linear-gradient(135deg, #ff073a, #ff4444); color: #fff; box-shadow: 0 0 15px rgba(255,7,58,0.6), 0 0 30px rgba(255,7,58,0.4), inset 0 -3px 10px rgba(0,0,0,0.3); text-shadow: 0 0 10px rgba(255,255,255,0.8); }
    .btn-neon-red:hover { box-shadow: 0 0 25px rgba(255,7,58,0.8), 0 0 50px rgba(255,7,58,0.5), inset 0 -3px 10px rgba(0,0,0,0.3); }
    .btn-neon-cyan { background: linear-gradient(135deg, #00ffff, #00cccc); color: #000; box-shadow: 0 0 15px rgba(0,255,255,0.6), 0 0 30px rgba(0,255,255,0.4), inset 0 -3px 10px rgba(0,0,0,0.2); }
    .btn-neon-cyan:hover { box-shadow: 0 0 25px rgba(0,255,255,0.8), 0 0 50px rgba(0,255,255,0.5), inset 0 -3px 10px rgba(0,0,0,0.2); }
    .reel-container { perspective: 1000px; }
    .reel-strip { display: flex; flex-direction: column; will-change: transform; }
    .reel-item { height: 100px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: 700; white-space: nowrap; padding: 0 12px; transition: opacity 0.1s; }
    .reel-item.center { font-size: 1.4rem; font-weight: 900; transform: scale(1.1); z-index: 10; text-shadow: 0 0 15px currentColor, 0 0 30px currentColor; }
    .reel-mask { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; background: linear-gradient(180deg, rgba(10,10,15,1) 0%, rgba(10,10,15,0) 30%, rgba(10,10,15,0) 70%, rgba(10,10,15,1) 100%); z-index: 5; }
    .reel-glow { position: absolute; left: 0; right: 0; height: 100px; top: calc(50% - 50px); pointer-events: none; z-index: 4; background: linear-gradient(180deg, transparent 0%, rgba(255,255,255,0.05) 50%, transparent 100%); border-top: 2px solid rgba(255,255,255,0.1); border-bottom: 2px solid rgba(255,255,255,0.1); }
    .lever { width: 60px; height: 280px; background: linear-gradient(180deg, #222 0%, #333 50%, #1a1a1a 100%); border-radius: 30px; position: relative; cursor: pointer; transform-origin: top center; transition: transform 0.15s cubic-bezier(0.25, 0.46, 0.45, 0.94); box-shadow: inset 0 2px 10px rgba(255,255,255,0.1), inset 0 -2px 10px rgba(0,0,0,0.5), 0 10px 30px rgba(0,0,0,0.5), 0 0 20px rgba(255,7,58,0.3); border: 2px solid #444; }
    .lever::before { content: ''; position: absolute; top: 15px; left: 50%; transform: translateX(-50%); width: 36px; height: 36px; background: radial-gradient(circle at 30% 30%, #ff4444, #cc0000 60%, #880000); border-radius: 50%; box-shadow: 0 0 20px rgba(255,0,0,0.8), 0 0 40px rgba(255,0,0,0.4), inset 0 -3px 8px rgba(0,0,0,0.4); border: 2px solid #ff6666; }
    .lever::after { content: ''; position: absolute; top: 0; left: 10%; right: 10%; bottom: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent); border-radius: 20px; pointer-events: none; }
    .lever.pulled { transform: rotate(-75deg); transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .lever-base { width: 100px; height: 40px; background: linear-gradient(180deg, #1a1a1a, #0a0a0a); border-radius: 50px; margin-top: -20px; box-shadow: 0 5px 20px rgba(0,0,0,0.5), inset 0 2px 5px rgba(255,255,255,0.05); border: 2px solid #333; position: relative; z-index: -1; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); z-index: 100; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: all 0.3s ease; padding: 20px; }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal-content { background: var(--panel-bg); border: 3px solid var(--neon-cyan); border-radius: 20px; padding: 40px; max-width: 480px; width: 100%; text-align: center; position: relative; transform: scale(0.8); transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); box-shadow: 0 0 40px rgba(0,255,255,0.4), 0 0 80px rgba(255,0,255,0.2), inset 0 0 60px rgba(0,255,255,0.05); }
    .modal-overlay.active .modal-content { transform: scale(1); }
    .modal-content::before { content: ''; position: absolute; inset: -3px; border-radius: 22px; background: conic-gradient(from 0deg, var(--neon-cyan), var(--neon-magenta), var(--neon-yellow), var(--neon-cyan)); z-index: -1; animation: borderSpin 3s linear infinite; opacity: 0.6; filter: blur(8px); }
    @keyframes borderSpin { to { transform: rotate(360deg); } }
    .badge { display: inline-block; padding: 6px 16px; border-radius: 9999px; font-size: 0.75rem; font-weight: 700; font-family: 'Orbitron', sans-serif; letter-spacing: 0.1em; }
    .badge-gps { background: rgba(0,255,255,0.15); border: 1px solid var(--neon-cyan); color: var(--neon-cyan); animation: pulse 1.5s ease-in-out infinite; }
    .badge-success { background: rgba(57,255,20,0.15); border: 1px solid var(--neon-green); color: var(--neon-green); }
    .badge-warn { background: rgba(255,255,0,0.15); border: 1px solid var(--neon-yellow); color: var(--neon-yellow); }
    @keyframes pulse { 0%, 100% { opacity: 1; box-shadow: 0 0 10px currentColor; } 50% { opacity: 0.6; box-shadow: 0 0 20px currentColor; } }
    @keyframes spinBlur { 0% { filter: blur(0px); } 50% { filter: blur(8px); } 100% { filter: blur(0px); } }
    .spinning .reel-strip { animation: spinBlur 100ms infinite; }
    .result-name { font-size: 2.5rem; font-weight: 900; letter-spacing: 0.05em; animation: neonFlicker 2s ease-in-out infinite alternate; }
    @keyframes neonFlicker { 0%, 100% { text-shadow: 0 0 10px currentColor, 0 0 20px currentColor, 0 0 40px currentColor; } 50% { text-shadow: 0 0 20px currentColor, 0 0 40px currentColor, 0 0 80px currentColor; } }
    .result-meta { font-size: 1.1rem; color: var(--text-dim); margin-top: 12px; }
    .result-tagline { margin-top: 24px; font-size: 1.3rem; font-weight: 700; font-family: 'Orbitron', sans-serif; color: var(--neon-yellow); text-shadow: 0 0 10px var(--neon-yellow), 0 0 20px var(--neon-yellow); animation: taglineFlash 1s ease-in-out infinite alternate; }
    @keyframes taglineFlash { 0% { opacity: 1; } 100% { opacity: 0.7; } }
    .confetti-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 99; }
    @media (max-width: 768px) { .reel-item { height: 80px; font-size: 0.95rem; } .reel-item.center { font-size: 1.2rem; } .reel-glow { height: 80px; top: calc(50% - 40px); } .lever { height: 200px; } .result-name { font-size: 1.8rem; } }
    @media (prefers-reduced-motion: reduce) { .reel-strip { transition: none !important; animation: none !important; } .lever { transition: none !important; } .modal-content { transition: none !important; } @keyframes neonFlicker { to { opacity: 1; } } @keyframes taglineFlash { to { opacity: 1; } } @keyframes borderSpin { to { opacity: 0.6; } } @keyframes pulse { to { opacity: 1; } } }
  </style>
</head>
<body class="bg-grid">
  <div class="min-h-screen flex flex-col items-center justify-center p-4 relative">
    <div class="absolute inset-0 pointer-events-none" aria-hidden="true">
      <div class="absolute top-1/4 left-10 w-64 h-64 rounded-full blur-[120px] opacity-20" style="background:var(--neon-cyan);animation:float 8s ease-in-out infinite;"></div>
      <div class="absolute bottom-1/4 right-10 w-64 h-64 rounded-full blur-[120px] opacity-20" style="background:var(--neon-magenta);animation:float 10s ease-in-out infinite reverse;"></div>
      <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 rounded-full blur-[150px] opacity-10" style="background:var(--neon-yellow);animation:float 12s ease-in-out infinite;"></div>
    </div>
    <style>@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-20px) scale(1.1)}66%{transform:translate(-20px,30px) scale(0.9)}}</style>

    <header class="mb-8 text-center relative z-10">
      <div class="inline-flex items-center gap-3 mb-3">
        <span class="text-2xl animate-bounce">🎰</span>
        <h1 class="font-orbitron text-4xl md:text-6xl font-black neon-text-cyan tracking-wider">柏青哥點餐機</h1>
        <span class="text-2xl animate-bounce" style="animation-delay:0.3s;">🎰</span>
      </div>
      <p class="text-lg md:text-xl font-medium text-center" style="color:var(--text-dim);">拉桿決定今晚命運</p>
      <div id="gps-badge" class="badge badge-gps mt-4 hidden" role="status" aria-live="polite">GPS 定位中...</div>
    </header>

    <main class="flex flex-col md:flex-row items-center gap-8 md:gap-12 relative z-10">
      <div class="flex items-center gap-4" role="region" aria-label="老虎機滾輪" aria-live="polite">
        <div class="reel-container" style="width:200px;">
          <div class="relative h-[300px] w-full neon-border-cyan rounded-xl overflow-hidden" style="background:var(--reel-bg);">
            <div class="reel-glow" style="border-color:var(--neon-cyan);"></div>
            <div id="reel1" class="reel-strip" style="transform:translateY(0px);"></div>
            <div class="reel-mask"></div>
          </div>
          <div class="text-center mt-2 text-xs font-orbitron" style="color:var(--neon-cyan);">REEL 1</div>
        </div>
        <div class="reel-container" style="width:200px;">
          <div class="relative h-[300px] w-full neon-border-magenta rounded-xl overflow-hidden" style="background:var(--reel-bg);">
            <div class="reel-glow" style="border-color:var(--neon-magenta);"></div>
            <div id="reel2" class="reel-strip" style="transform:translateY(0px);"></div>
            <div class="reel-mask"></div>
          </div>
          <div class="text-center mt-2 text-xs font-orbitron" style="color:var(--neon-magenta);">REEL 2</div>
        </div>
        <div class="reel-container" style="width:200px;">
          <div class="relative h-[300px] w-full neon-border-yellow rounded-xl overflow-hidden" style="background:var(--reel-bg);">
            <div class="reel-glow" style="border-color:var(--neon-yellow);"></div>
            <div id="reel3" class="reel-strip" style="transform:translateY(0px);"></div>
            <div class="reel-mask"></div>
          </div>
          <div class="text-center mt-2 text-xs font-orbitron" style="color:var(--neon-yellow);">REEL 3</div>
        </div>
      </div>

      <div class="flex flex-col items-center gap-3" role="button" tabindex="0" aria-label="拉動拉桿開始抽籤" id="lever-container">
        <div id="lever" class="lever" aria-hidden="true"></div>
        <div class="lever-base"></div>
        <span class="text-xs font-orbitron tracking-widest" style="color:var(--text-dim);">PULL LEVER</span>
      </div>
    </main>

    <div class="mt-10 flex flex-col md:flex-row items-center gap-6 relative z-10">
      <button id="spin-btn" class="btn-neon btn-neon-red px-12 py-5 text-2xl md:text-3xl rounded-xl min-w-[280px]" aria-label="開始抽籤" disabled>SPIN 決定命運</button>
      <button id="gps-btn" class="btn-neon btn-neon-cyan px-8 py-4 text-lg rounded-xl min-w-[220px]" aria-label="取得周邊 15 分鐘餐廳">📍 取得周邊 15分鐘餐廳</button>
    </div>

    <div id="status-bar" class="mt-8 text-center text-sm font-mono hidden" style="color:var(--text-dim);" aria-live="polite"></div>

    <div id="modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-content">
        <div id="modal-title" class="result-name neon-text-cyan" style="color:var(--neon-cyan);"></div>
        <div id="modal-meta" class="result-meta"></div>
        <div class="result-tagline">不得異議，違者請客</div>
        <button id="modal-close" class="btn-neon btn-neon-cyan mt-8 px-10 py-3 text-lg rounded-xl" aria-label="關閉並重新抽籤">再抽一次</button>
      </div>
    </div>

    <canvas id="confetti-canvas" class="confetti-canvas" aria-hidden="true"></canvas>
  </div>

  <script>
    const DEFAULT_RESTAURANTS = [
      { name: '鼎泰豐', rating: 4.5, distance: '0.3 km', category: '台式點心' },
      { name: '永和豆漿', rating: 4.3, distance: '0.1 km', category: '早餐' },
      { name: '饒河夜市大腸包小腸', rating: 4.6, distance: '1.2 km', category: '夜市小吃' },
      { name: '阿宗麵線', rating: 4.4, distance: '0.8 km', category: '麵食' },
      { name: '阜杭豆漿', rating: 4.7, distance: '1.5 km', category: '早餐' },
      { name: '金峰魯肉飯', rating: 4.5, distance: '0.5 km', category: '台式便當' },
      { name: '淇園生煎包', rating: 4.4, distance: '0.7 km', category: '生煎包' },
      { name: '劉媽媽雞排', rating: 4.3, distance: '0.4 km', category: '炸物' },
      { name: '鮮芋仙', rating: 4.2, distance: '0.9 km', category: '甜點' },
      { name: '秀蘭牛肉麵', rating: 4.6, distance: '1.1 km', category: '牛肉麵' },
    ];

    const REEL_ITEM_HEIGHT = 100;
    const STRIP_ITEMS = 30;
    const SPIN_DURATIONS = [2500, 2800, 3100];
    const REEL_COLORS = ['var(--neon-cyan)', 'var(--neon-magenta)', 'var(--neon-yellow)'];

    let reelData = [...DEFAULT_RESTAURANTS];
    let isSpinning = false;
    let audioCtx = null;
    let useRealRestaurants = false;

    const reels = [document.getElementById('reel1'), document.getElementById('reel2'), document.getElementById('reel3')];
    const spinBtn = document.getElementById('spin-btn');
    const gpsBtn = document.getElementById('gps-btn');
    const lever = document.getElementById('lever');
    const leverContainer = document.getElementById('lever-container');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modal-title');
    const modalMeta = document.getElementById('modal-meta');
    const modalClose = document.getElementById('modal-close');
    const gpsBadge = document.getElementById('gps-badge');
    const statusBar = document.getElementById('status-bar');

    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playTone(freq, duration, type='sine', gainVal=0.1, startTime=0) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.value = gainVal;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const t = audioCtx.currentTime + startTime;
      osc.start(t);
      osc.stop(t + duration);
    }

    function playSpinTick(reelIndex) {
      const freqs = [880, 1100, 1320];
      playTone(freqs[reelIndex], 0.05, 'square', 0.06);
    }

    function playStopThunk(reelIndex) {
      const freqs = [220, 180, 150];
      playTone(freqs[reelIndex], 0.15, 'sawtooth', 0.12);
    }

    function playWinFanfare() {
      if (!audioCtx) return;
      const notes = [523.25, 659.25, 783.99, 1046.5, 1318.51, 1567.98];
      notes.forEach((freq, i) => {
        playTone(freq, 0.18, 'triangle', 0.08, i * 0.08);
      });
      setTimeout(() => {
        playTone(1046.5, 0.4, 'sine', 0.12, 0);
        playTone(1318.51, 0.4, 'sine', 0.12, 0);
      }, 500);
    }

    function vibrate(pattern) {
      if (navigator.vibrate) navigator.vibrate(pattern);
    }

    function fireConfetti() {
      if (typeof confetti === 'function') {
        const duration = 3000;
        const end = Date.now() + duration;
        const colors = ['#00ffff', '#ff00ff', '#ffff00', '#39ff14', '#ff6600', '#ff073a', '#ffffff'];
        (function frame() {
          confetti({ particleCount: 7, angle: 60, spread: 55, origin: { x: 0 }, colors, scalar: 1.2, zIndex: 99 });
          confetti({ particleCount: 7, angle: 120, spread: 55, origin: { x: 1 }, colors, scalar: 1.2, zIndex: 99 });
          if (Date.now() < end) requestAnimationFrame(frame);
        })();
      } else {
        for (let i = 0; i < 50; i++) {
          const el = document.createElement('div');
          el.style.cssText = 'position:fixed;left:'+Math.random()*100+'vw;top:-20px;width:10px;height:10px;background:'+colors[Math.floor(Math.random()*colors.length)]+';border-radius:50%;pointer-events:none;z-index:99;animation:fall '+(2+Math.random()*2)+'s linear forwards';
          document.body.appendChild(el);
          setTimeout(() => el.remove(), 4000);
        }
        const style = document.createElement('style');
        style.textContent = '@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}';
        document.head.appendChild(style);
      }
    }

    function buildReelStrip(restaurants, reelIndex) {
      const items = [];
      for (let i = 0; i < STRIP_ITEMS; i++) {
        const r = restaurants[i % restaurants.length];
        const isCenter = i === Math.floor(STRIP_ITEMS / 2);
        items.push('<div class="reel-item '+(isCenter?'center':'')+'" style="color: '+REEL_COLORS[reelIndex]+'" data-name="'+r.name+'" data-rating="'+r.rating+'" data-distance="'+r.distance+'" data-category="'+r.category+'">'+r.name+'</div>');
      }
      return items.join('');
    }

    function renderAllReels() {
      reels.forEach((reel, i) => {
        reel.innerHTML = buildReelStrip(reelData, i);
        reel.style.transform = 'translateY(0px)';
        reel.classList.remove('spinning');
      });
    }

    function getCenterItem(reel) {
      const items = reel.querySelectorAll('.reel-item');
      const centerIndex = Math.floor(items.length / 2);
      return items[centerIndex];
    }

    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

    function animateReel(reel, targetOffset, duration, onProgress, onComplete) {
      const start = performance.now();
      const startOffset = 0;
      reel.classList.add('spinning');
      function step(now) {
        const elapsed = now - start;
        const progress = Math.min(elapsed / duration, 1);
        const eased = easeOutCubic(progress);
        const currentOffset = startOffset + (targetOffset - startOffset) * eased;
        reel.style.transform = 'translateY('+currentOffset+'px)';
        if (onProgress) onProgress(eased, progress);
        if (progress < 1) {
          requestAnimationFrame(step);
        } else {
          reel.classList.remove('spinning');
          if (onComplete) onComplete();
        }
      }
      requestAnimationFrame(step);
    }

    async function spin() {
      if (isSpinning) return;
      isSpinning = true;
      spinBtn.disabled = true;
      spinBtn.textContent = 'SPINNING...';
      lever.classList.add('pulled');
      vibrate([50, 30, 50, 30, 100]);
      initAudio();

      const targetIndices = [
        Math.floor(Math.random() * reelData.length),
        Math.floor(Math.random() * reelData.length),
        Math.floor(Math.random() * reelData.length),
      ];

      const spinPromises = reels.map((reel, i) => {
        return new Promise((resolve) => {
          const targetIndex = targetIndices[i];
          const centerIndex = Math.floor(STRIP_ITEMS / 2);
          const offset = (targetIndex - centerIndex) * REEL_ITEM_HEIGHT;
          const fullCycles = 5 * STRIP_ITEMS * REEL_ITEM_HEIGHT;
          const targetOffset = -(fullCycles + offset);

          let tickCount = 0;
          animateReel(reel, targetOffset, SPIN_DURATIONS[i],
            (eased, progress) => {
              const tickThreshold = 0.02;
              if (progress > tickCount * tickThreshold) {
                playSpinTick(i);
                tickCount++;
              }
            },
            () => {
              playStopThunk(i);
              vibrate([30]);
              resolve(getCenterItem(reel).dataset.name);
            }
          );
        });
      });

      const results = await Promise.all(spinPromises);
      const allMatch = results[0] === results[1] && results[1] === results[2];

      setTimeout(() => { lever.classList.remove('pulled'); }, 300);

      if (allMatch) {
        vibrate([100, 50, 100, 50, 200, 100, 200]);
        playWinFanfare();
        fireConfetti();
        showModal(results[0]);
      } else {
        spinBtn.disabled = false;
        spinBtn.textContent = 'SPIN 決定命運';
      }
    }

    function showModal(restaurantName) {
      const restaurant = reelData.find(r => r.name === restaurantName) || { name: restaurantName, rating: '?', distance: '?', category: '?' };
      modalTitle.textContent = restaurant.name;
      modalTitle.style.color = REEL_COLORS[Math.floor(Math.random() * REEL_COLORS.length)];
      modalMeta.innerHTML = '<span class="font-orbitron">⭐ '+restaurant.rating+'</span> · <span class="font-orbitron">📍 '+restaurant.distance+'</span> · <span style="color:var(--text-dim);">'+restaurant.category+'</span>';
      modal.classList.add('active');
    }

    function closeModal() {
      modal.classList.remove('active');
      spinBtn.disabled = false;
      spinBtn.textContent = 'SPIN 決定命運';
      isSpinning = false;
    }

    async function fetchNearbyRestaurants(lat, lng) {
      const query = '[out:json][timeout:10];node(around:1200,'+lat+','+lng+')["amenity"~"restaurant|fast_food|cafe"];out body 20;';
      const url = 'https://overpass-api.de/api/interpreter?data=' + encodeURIComponent(query);
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 10000);
        const response = await fetch(url, { signal: controller.signal });
        clearTimeout(timeoutId);
        if (!response.ok) throw new Error('Overpass API error');
        const data = await response.json();
        const restaurants = data.elements
          .filter(el => el.tags && el.tags.name)
          .map(el => {
            const d = el.lat && el.lng ? Math.round(Math.sqrt(Math.pow((el.lat - lat) * 111000, 2) + Math.pow((el.lng - lng) * 111000 * Math.cos(lat * Math.PI / 180), 2))) : null;
            return { name: el.tags.name, rating: (4 + Math.random() * 1).toFixed(1), distance: d ? d + 'm' : '未知距離', category: el.tags.cuisine || el.tags.amenity || '餐廳' };
          })
          .slice(0, 20);
        return restaurants.length > 0 ? restaurants : null;
      } catch (e) {
        console.warn('Overpass fetch failed:', e);
        return null;
      }
    }

    function updateGpsBadge(text, type = 'gps') {
      gpsBadge.textContent = text;
      gpsBadge.className = 'badge ' + (type === 'success' ? 'badge-success' : type === 'warn' ? 'badge-warn' : 'badge-gps');
      gpsBadge.classList.remove('hidden');
    }

    async function loadGpsRestaurants() {
      updateGpsBadge('GPS 定位中...', 'gps');
      gpsBtn.disabled = true;
      gpsBtn.textContent = '定位中...';
      if (!navigator.geolocation) {
        updateGpsBadge('⚠️ 瀏覽器不支援 GPS，使用預設餐廳', 'warn');
        gpsBtn.disabled = false;
        gpsBtn.textContent = '📍 取得周邊 15分鐘餐廳';
        return;
      }
      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          const { latitude, longitude } = pos.coords;
          updateGpsBadge('📡 正在查詢周邊餐廳...', 'gps');
          const restaurants = await fetchNearbyRestaurants(latitude, longitude);
          if (restaurants && restaurants.length > 0) {
            reelData = restaurants;
            useRealRestaurants = true;
            renderAllReels();
            updateGpsBadge('📍 已成功載入周邊 ' + restaurants.length + ' 家真實餐廳！', 'success');
            statusBar.textContent = '定位成功：' + latitude.toFixed(4) + ', ' + longitude.toFixed(4) + ' | ' + restaurants.length + ' 家餐廳';
            statusBar.classList.remove('hidden');
          } else {
            updateGpsBadge('⚠️ 附近無資料，使用預設餐廳', 'warn');
            reelData = DEFAULT_RESTAURANTS;
            useRealRestaurants = false;
            renderAllReels();
          }
          gpsBtn.disabled = false;
          gpsBtn.textContent = '📍 重新取得周邊餐廳';
        },
        (err) => {
          let msg = '⚠️ ';
          if (err.code === 1) msg += '拒絕定位權限';
          else if (err.code === 2) msg += '位置不可用';
          else if (err.code === 3) msg += '定位逾時';
          else msg += '定位失敗';
          msg += '，使用預設餐廳';
          updateGpsBadge(msg, 'warn');
          reelData = DEFAULT_RESTAURANTS;
          useRealRestaurants = false;
          renderAllReels();
          gpsBtn.disabled = false;
          gpsBtn.textContent = '📍 重新取得周邊餐廳';
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }

    spinBtn.addEventListener('click', () => { initAudio(); spin(); });
    leverContainer.addEventListener('click', () => { initAudio(); spin(); });
    leverContainer.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); initAudio(); spin(); } });
    gpsBtn.addEventListener('click', loadGpsRestaurants);
    modalClose.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('active')) closeModal();
      if (e.key === ' ' && !isSpinning && document.activeElement === document.body) { e.preventDefault(); initAudio(); spin(); }
    });

    renderAllReels();
    loadGpsRestaurants();
  </script>
</body>
</html>
